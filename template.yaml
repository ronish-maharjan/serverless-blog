AWSTemplateFormatVersion: "2010-09-09"

Transform:
  - AWS::Serverless-2016-10-31

Description: >
  Serverless portfolio and blog for Ronish Maharjan.
  Student ID: 79010424.

Parameters:

  StudentId:
    Type: String
    Default: "79010424"
    Description: Student ID used in AWS resource names


Resources:

  ############################################################
  # PRIVATE S3 BUCKET
  #
  # Stores:
  #   HTML
  #   CSS
  #   JavaScript
  #   Images
  #
  # Browser NEVER accesses this bucket directly.
  #
  # Browser
  #    |
  #    v
  # API Gateway
  #    |
  #    v
  # Frontend Lambda
  #    |
  #    v
  # Private S3
  ############################################################

  FrontendBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName: !Sub
        - "ronish-${StudentId}-frontend-${AWS::AccountId}"
        - {}

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  ############################################################
  # DYNAMODB BLOG TABLE
  ############################################################

  BlogTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName: !Sub
        - "ronish-${StudentId}-blog-posts"
        - {}

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: id
          AttributeType: S

      KeySchema:

        - AttributeName: id
          KeyType: HASH


  ############################################################
  # COGNITO USER POOL
  #
  # Used for admin login.
  #
  # Public signup is disabled.
  ############################################################

  UserPool:
    Type: AWS::Cognito::UserPool

    Properties:

      UserPoolName: !Sub
        - "ronish-${StudentId}-users"
        - {}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:

        AllowAdminCreateUserOnly: true

      Policies:

        PasswordPolicy:

          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true


  ############################################################
  # COGNITO APP CLIENT
  #
  # Browser client.
  #
  # No client secret because this is a public browser client.
  ############################################################

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:

      ClientName: !Sub
        - "ronish-${StudentId}-web-client"
        - {}

      UserPoolId: !Ref UserPool

      GenerateSecret: false

      ExplicitAuthFlows:

        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH


  ############################################################
  # CLOUDWATCH LOG GROUP
  #
  # Frontend Lambda
  ############################################################

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub
        - "/aws/lambda/ronish-${StudentId}-frontend"
        - {}

      RetentionInDays: 7


  ############################################################
  # CLOUDWATCH LOG GROUP
  #
  # Backend Lambda
  ############################################################

  BackendLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub
        - "/aws/lambda/ronish-${StudentId}-backend"
        - {}

      RetentionInDays: 7


  ############################################################
  # CLOUDWATCH LOG GROUP
  #
  # API GATEWAY ACCESS LOGS
  ############################################################

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub
        - "/aws/apigateway/ronish-${StudentId}"
        - {}

      RetentionInDays: 7


  ############################################################
  # API GATEWAY HTTP API
  #
  # Cognito is the DEFAULT authorizer.
  #
  # Routes that should be public explicitly use:
  #
  #     Auth:
  #       Authorizer: NONE
  ############################################################

  PortfolioApi:
    Type: AWS::Serverless::HttpApi

    Properties:

      Name: !Sub
        - "ronish-${StudentId}-api"
        - {}

      StageName: "$default"

      ########################################################
      # COGNITO JWT AUTHORIZER
      ########################################################

      Auth:

        DefaultAuthorizer: CognitoAuthorizer

        Authorizers:

          CognitoAuthorizer:

            IdentitySource: "$request.header.Authorization"

            JwtConfiguration:

              audience:

                - !Ref UserPoolClient

              issuer: !Sub
                - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
                - UserPoolId: !Ref UserPool

      ########################################################
      # API GATEWAY ACCESS LOGGING
      ########################################################

      AccessLogSettings:

        DestinationArn: !GetAtt
          - ApiAccessLogGroup
          - Arn

        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","ip":"$context.identity.sourceIp"}


  ############################################################
  # FRONTEND LAMBDA
  #
  # SERVES STATIC FILES FROM PRIVATE S3
  #
  # Examples:
  #
  # GET /
  # GET /index.html
  # GET /blog.html
  # GET /post.html
  # GET /login.html
  # GET /admin.html
  # GET /css/style.css
  # GET /js/blog.js
  #
  ############################################################

  FrontendFunction:
    Type: AWS::Serverless::Function

    DependsOn:

      - FrontendLogGroup

    Properties:

      FunctionName: !Sub
        - "ronish-${StudentId}-frontend"
        - {}

      CodeUri: frontend-lambda/

      ########################################################
      # IMPORTANT
      #
      # esbuild produces:
      #
      # handler.js
      #
      # containing:
      #
      # export const handler = ...
      #
      ########################################################

      Handler: handler.handler

      Runtime: nodejs24.x

      Timeout: 10

      MemorySize: 256

      ########################################################
      # AWS ACADEMY EXISTING ROLE
      #
      # DO NOT CREATE A NEW IAM ROLE.
      ########################################################

      Role: !Sub
        - "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole"
        - {}

      Environment:

        Variables:

          FRONTEND_BUCKET: !Ref FrontendBucket

      Events:

        ######################################################
        # ROOT
        #
        # GET /
        ######################################################

        RootRoute:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /

            Method: ANY

            Auth:

              Authorizer: NONE


        ######################################################
        # ALL FRONTEND PATHS
        #
        # /blog.html
        # /css/style.css
        # /js/blog.js
        # /images/example.jpg
        #
        ######################################################

        FrontendRoute:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /{proxy+}

            Method: ANY

            Auth:

              Authorizer: NONE

    ##########################################################
    # SAM ESBUILD CONFIGURATION
    ##########################################################

    Metadata:

      BuildMethod: esbuild

      BuildProperties:

        EntryPoints:

          - src/handler.ts

        Format: cjs

        Minify: false

        Target: es2022


  ############################################################
  # BACKEND LAMBDA
  #
  # Business logic:
  #
  # POST   /api/auth/login
  # GET    /api/posts
  # GET    /api/posts/{id}
  # POST   /api/posts
  # PUT    /api/posts/{id}
  # DELETE /api/posts/{id}
  ############################################################

  BackendFunction:
    Type: AWS::Serverless::Function

    DependsOn:

      - BackendLogGroup

    Properties:

      FunctionName: !Sub
        - "ronish-${StudentId}-backend"
        - {}

      CodeUri: backend-lambda/

      ########################################################
      # esbuild output:
      #
      # handler.js
      ########################################################

      Handler: handler.handler

      Runtime: nodejs24.x

      Timeout: 15

      MemorySize: 256

      ########################################################
      # AWS ACADEMY EXISTING ROLE
      #
      # DO NOT CREATE A NEW IAM ROLE.
      ########################################################

      Role: !Sub
        - "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole"
        - {}

      Environment:

        Variables:

          BLOG_TABLE_NAME: !Ref BlogTable

          COGNITO_CLIENT_ID: !Ref UserPoolClient

      Events:

        ######################################################
        # LOGIN
        #
        # PUBLIC
        ######################################################

        Login:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/auth/login

            Method: POST

            Auth:

              Authorizer: NONE


        ######################################################
        # GET ALL POSTS
        #
        # PUBLIC
        ######################################################

        GetPosts:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/posts

            Method: GET

            Auth:

              Authorizer: NONE


        ######################################################
        # GET ONE POST
        #
        # PUBLIC
        ######################################################

        GetPost:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/posts/{id}

            Method: GET

            Auth:

              Authorizer: NONE


        ######################################################
        # CREATE POST
        #
        # COGNITO REQUIRED
        ######################################################

        CreatePost:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/posts

            Method: POST

            Auth:

              Authorizer: CognitoAuthorizer


        ######################################################
        # UPDATE POST
        #
        # COGNITO REQUIRED
        ######################################################

        UpdatePost:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/posts/{id}

            Method: PUT

            Auth:

              Authorizer: CognitoAuthorizer


        ######################################################
        # DELETE POST
        #
        # COGNITO REQUIRED
        ######################################################

        DeletePost:

          Type: HttpApi

          Properties:

            ApiId: !Ref PortfolioApi

            Path: /api/posts/{id}

            Method: DELETE

            Auth:

              Authorizer: CognitoAuthorizer

    ##########################################################
    # SAM ESBUILD CONFIGURATION
    ##########################################################

    Metadata:

      BuildMethod: esbuild

      BuildProperties:

        EntryPoints:

          - src/handler.ts

        Format: cjs

        Minify: false

        Target: es2022


############################################################
# OUTPUTS
############################################################

Outputs:

  ##########################################################
  # LIVE WEBSITE URL
  ##########################################################

  ApiUrl:

    Description:
      Live portfolio and blog URL through API Gateway

    Value: !Sub
      - "https://${PortfolioApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
      - {}


  ##########################################################
  # PRIVATE S3 BUCKET
  ##########################################################

  FrontendBucketName:

    Description:
      Private S3 bucket containing frontend files

    Value: !Ref FrontendBucket


  ##########################################################
  # DYNAMODB
  ##########################################################

  BlogTableName:

    Description:
      DynamoDB table containing blog posts

    Value: !Ref BlogTable


  ##########################################################
  # COGNITO
  ##########################################################

  UserPoolId:

    Description:
      Cognito User Pool ID

    Value: !Ref UserPool


  UserPoolClientId:

    Description:
      Cognito Web App Client ID

    Value: !Ref UserPoolClient


  ##########################################################
  # LAMBDAS
  ##########################################################

  FrontendLambdaName:

    Description:
      Frontend Lambda serving files from private S3

    Value: !Ref FrontendFunction


  BackendLambdaName:

    Description:
      Backend Lambda handling blog business logic

    Value: !Ref BackendFunction


  ##########################################################
  # STUDENT ID
  ##########################################################

  StudentId:

    Description:
      Student ID

    Value: !Ref StudentId

